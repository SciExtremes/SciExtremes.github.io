{{/* Only the icons used by navigation are defined; no icon-library dependency. */}}
<svg
  width="20"
  height="20"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  {{ if eq . "search" }}
    <circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 5 5" />
  {{ else if eq . "menu" }}
    <path d="M4 6h16M4 12h16M4 18h16" />
  {{ else if eq . "close" }}
    <path d="m6 6 12 12M6 18 18 6" />
  {{ end }}
</svg>

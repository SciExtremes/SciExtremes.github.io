bio: |
  我专注于气候科学领域，致力于使用水文气候、数据驱动和空间统计方法，增进对野火和极端气候事件的理解。
  目前以第一作者或通讯作者在Science Advances, Communications Earth & Environment, Scientific Data等期刊发表论文10篇，以其他作者身份发表论文5篇，参与编写专著2部，授权发明专利1项。
  研究成果获得Nature Briefing、Vox、The Conversation和The Debrief等知名科技媒体的采访或报道。
  
  我目前在加州大学Merced分校做博士后，与[John Abatzoglou教授](https://engineering.ucmerced.edu/content/john-abatzoglou)合作，他领导着[Climatology Lab](https://www.climatologylab.org)。


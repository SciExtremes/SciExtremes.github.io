# Three paragraphs: significance/objectives, methods/published progress, next steps.
# Resource IDs are curated here; publication and data records do not store SQ associations.
- id: sq1
  title:
    en: How do climate change and natural variability shape the intensity, persistence, and synchronicity
      of climate extremes?
    zh: 气候变化与自然变率如何共同影响极端气候事件的强度、持续性与同步性？
  paragraphs:
    en:
    - Climate extremes can persist through time, affect multiple regions simultaneously, or combine different
      hazards, creating pressures that single-event analyses may overlook. I aim to explain how climate
      change and natural variability shape the intensity, persistence, and synchronicity of these events,
      and how land–atmosphere interactions contribute to their development. This work examines heatwaves,
      compound extremes, and fire weather within a common climate-science framework.
    - Using observations, reanalysis, and climate simulations, I combine event-based analysis with statistical
      and geospatial methods to characterize extremes and examine their drivers. Published work documents
      increasing synchronicity of extreme fire weather and evaluates the contributions of climate change
      and natural variability. Open heatwave datasets and a compound-event detection toolbox provide reproducible
      foundations for comparing event characteristics and environmental responses.
    - Building on these advances, my next steps are to investigate the mechanisms of concurrent and compound
      extremes, including interactions among background warming, large-scale climate modes, and land-surface
      conditions. The aim is to improve physical understanding and develop transferable approaches for
      assessing evolving climate hazards across regions.
    zh:
    - 气候极端事件可能长期持续、在多个区域同期发生，或与其他灾害条件相互叠加，其影响往往超出单一事件分析的范围。我的研究旨在解释气候变化、自然变率和陆气相互作用如何影响极端事件的强度、持续性与同步性，将热浪、复合极端事件和火险天气纳入共同的气候科学研究框架。
    - 我结合观测、再分析与气候模拟，运用基于事件的分析、统计与地理空间方法，刻画极端事件特征并研究其驱动机制。已发表工作揭示了极端火险天气同步性的增加，并分析气候变化与自然变率的作用；开放热浪数据集和复合事件识别工具为比较事件特征及环境响应提供了可复现基础。
    - 下一步将进一步探索同期与复合极端事件的形成机制，关注背景增暖、大尺度气候模态与陆面条件之间的相互作用，深化对极端事件的物理理解，并发展适用于不同区域的气候风险分析方法。

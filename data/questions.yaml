- id: sq2
  title:
    en: Under what conditions does extreme fire weather contribute to extreme wildfires, and what controls
      their behavior?
    zh: 极端火险天气在何种条件下促成极端野火，其行为受哪些因素控制？
  paragraphs:
    en:
    - The influence of extreme fire weather on wildfire activity varies with fuels, ignitions, and landscape
      context. Understanding this variation is essential for interpreting why some fires become exceptionally
      large, fast-spreading, or radiatively active. I aim to identify the conditions that favor extreme
      fires and explain how environmental drivers shape their occurrence, growth, and behavior across
      different regions and ecosystems.
    - I link climate records with satellite observations and individual fire events, combining event-based
      analyses, spatial comparisons, and statistical modeling. Published studies show how persistent fire
      weather waves and heatwaves relate to wildfire activity. These findings establish a foundation for
      examining how the timing and duration of fire-favorable conditions interact with local environmental
      context, and for treating persistence, synchronicity, and fire behavior as complementary dimensions.
    - My next steps are to develop multidimensional approaches to characterizing extreme wildfire behavior
      and to investigate its environmental drivers using Earth observations and explainable modeling.
      The goal is to better understand differences in fire size, spread speed, and radiative activity,
      while evaluating how robust these relationships are across regions and ecosystems.
    zh:
    - 极端火险天气对野火活动的影响随可燃物、点火和景观条件而变化。理解这些差异，有助于解释为何部分野火表现出异常规模、快速蔓延或强烈辐射活动。我的研究旨在识别促成极端野火的条件，解释环境驱动因素如何影响不同区域与生态系统中的野火发生、增长和行为。
    - 我连接气候记录、卫星观测与单次野火事件，综合开展基于事件的分析、空间比较和统计建模。已发表研究阐明了持续火险天气波、热浪与野火活动之间的联系，为探索有利火灾条件的出现时间和持续时长如何与局地环境共同作用提供了基础，并将持续性、同步性与野火行为作为互补的研究维度。
    - 下一步将发展极端野火行为的多维表征方法，结合地球观测与可解释建模研究其环境驱动机制，进一步理解野火规模、蔓延速度和辐射活动的差异，并评估相关关系在不同区域与生态系统中的稳健性。

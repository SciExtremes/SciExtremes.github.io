- id: sq3
  title:
    en: Why do some extreme wildfires cause catastrophic impacts, and how can future risks be anticipated?
    zh: 为何部分极端野火会造成灾难性影响，我们又该如何预判未来风险？
  paragraphs:
    en:
    - The severity of wildfire impacts depends on both fire behavior and the people, ecosystems, and infrastructure
      in its path. Understanding this interaction is important for explaining spatial differences in disaster
      risk and supporting preparedness. I aim to connect physical fire extremes with environmental consequences
      and societal exposure, and to identify which conditions make extreme fires especially consequential.
    - I combine geospatial fire and climate information with exposure data, using event-based analysis,
      statistical methods, and data-driven approaches to investigate these relationships. Published work
      on synchronous fire weather links concurrent conditions with fire activity and smoke-related air
      pollution, and highlights their implications for coordination and shared firefighting resources.
      This provides a basis for examining how hazards operating across regions translate into environmental
      and societal pressures.
    - The next stage extends toward wildfire disaster risk, differences in population and infrastructure
      exposure, and approaches to anticipating future conditions. I plan to assess environmental drivers
      and potential changes under future climates through explainable modeling, with attention to validation
      and uncertainty. The long-term goal is to provide scientific evidence that can inform risk assessment
      and preparedness.
    zh:
    - 野火影响的严重程度取决于火灾行为，以及受影响的人群、生态系统与基础设施。理解这些因素的共同作用，有助于解释灾害风险的空间差异并支持灾害应对。我的研究旨在连接野火物理极端性、环境后果与社会暴露，识别使极端野火产生严重影响的关键条件。
    - 我整合野火、气候与暴露的地理空间信息，运用基于事件的分析、统计及数据驱动方法研究相关联系。已发表的火险天气同步性研究揭示了同期条件与火灾活动、烟雾相关空气污染之间的联系，并讨论其对跨区域协调和共享灭火资源的影响，为研究区域间灾害压力提供了依据。
    - 下一步将拓展至野火灾害风险、人口和基础设施暴露差异及未来风险预判，结合可解释建模评估环境驱动因素与未来气候下的潜在变化，并重视模型验证和不确定性，逐步为风险评估与灾害应对提供科学依据。

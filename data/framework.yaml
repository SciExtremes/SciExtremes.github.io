# Shared bilingual framework; stage SQ links stay inside Research.
# Link a term only when it is a main research topic or result of the selected paper.
title:
  en: Research Framework
  zh: 研究框架
description:
  en: Climate change and natural variability influence the intensity, persistence, and synchronicity of
    extreme conditions. Their effects on wildfire activity depend on fuels, ignitions, and landscape context,
    while environmental and societal consequences also reflect exposure and vulnerability. The framework
    links these processes with three scientific questions, from the development of climate extremes to
    extreme wildfire behavior and future risks. Earth observations, climate analysis, and data-driven
    methods provide a shared foundation for observing events, investigating their mechanisms, and assessing
    risk. These connections guide both my published research and the directions I am developing.
  zh: 气候变化与自然变率影响极端条件的强度、持续性和同步性，其对野火活动的作用受到可燃物、点火与景观条件的共同调节；野火的环境和社会后果还取决于暴露与脆弱性。这一框架通过三个科学问题，将气候极端事件的形成、极端野火行为及其影响与未来风险连接起来。地球观测、气候分析和数据驱动方法贯穿事件观测、机制解释与风险评估，为已发表研究和下一步工作提供共同基础。

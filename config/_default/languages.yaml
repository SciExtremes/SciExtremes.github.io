# Languages
#   Create a section for each of your site's languages.
#   Documentation: https://docs.hugoblox.com/reference/language/

# Default language
en:
  locale: en-us
  # Uncomment for multi-lingual sites, and move English content into `en` sub-folder.
  contentDir: content/en

# Uncomment the lines below to configure your website in a second language.
zh:
 locale: zh-Hans
 contentDir: content/zh
 title: 殷聪
 params:
   description: Site description in Chinese...
   hugoblox:
     locale:
       date_format: "2006年1月2日"
       time_format: "15:04"
     copyright:
       # Copyright notice - supports {year}, {name}, {license} placeholders
       notice: "© {year} {name}，本作品采用 {license} 许可。"
       license:
         type: cc                          # cc | custom
         allow_derivatives: false
         share_alike: true
         allow_commercial: false   
 menu:
   main:
     - name: 个人简介
       url: /
       weight: 10
     - name: 研究方向
       url: research/
       weight: 15
     - name: 学术论文
       url: publications/
       weight: 20
     - name: 数据产品
       url: products/
       weight: 25
     - name: 进展动态
       url: news/
       weight: 30
